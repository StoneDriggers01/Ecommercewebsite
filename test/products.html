<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plywood Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-overlay"></div>

    <section class="hero small-hero">
        <div class="marketplace-title-box">
            <h1>Marketplace Listings</h1>
        </div>

        <div class="marketplace-subtitle-box">
            <p>Browse, search, and post items from local scavengers.</p>
        </div>
    </section>

    <div class="products-layout">
        <div class="create-listing">
            <p class="eyebrow">SIGNED-IN SELLER</p>
            <p>Welcome, <span id="user-display"></span>!</p>

            <input
                type="text"
                id="search-input"
                placeholder="Search listings or tags..."
            >

            <h2>Create a New Listing</h2>

            <form id="listing-form">
                <input type="text" id="item-title" placeholder="Item Title" required>
                <input type="number" id="item-price" placeholder="Price ($)" min="0" step="0.01" required>
                <textarea id="item-desc" placeholder="Description..." required></textarea>

                <input type="file" id="item-image" accept="image/*">

                <input type="text" id="item-tags" placeholder="Tags (comma separated)">
                <input type="text" id="item-location" placeholder="Location">
                <input type="text" id="item-contact" placeholder="Contact Info">
                <input type="text" id="item-payment" placeholder="Payment Method">

                <button type="submit">Post Item</button>
            </form>
        </div>

        <div class="listings-column">
            <div class="active-listings-box">
                <h2>Active Listings</h2>
            </div>

            <div id="listings-container">
                <p>Loading listings...</p>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script type="module" src="site.js"></script>
</body>
</html>
