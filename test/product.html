<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Plywood</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-overlay"></div>

    <section class="product-details-card">
        <p class="eyebrow">PLYWOOD LISTING</p>

        <h1 id="title">Loading...</h1>

        <img id="image" class="product-details-image" alt="Product image">

        <p class="product-price" id="price"></p>
        <p class="product-desc" id="desc"></p>
        <p class="product-tags" id="tags"></p>

        <div class="product-detail-grid">
            <div>
                <h2>Location</h2>
                <p id="location"></p>
            </div>

            <div>
                <h2>Contact</h2>
                <p id="contact"></p>
            </div>

            <div>
                <h2>Payment</h2>
                <p id="payment"></p>
            </div>
        </div>
    </section>

    <script type="module">
        import {
            db,
            doc,
            getDoc
        } from "./firebase.js";

        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
            document.getElementById("title").textContent = "Listing not found.";
        } else {
            try {
                const listingRef = doc(db, "listings", id);
                const snap = await getDoc(listingRef);

                if (snap.exists()) {
                    const data = snap.data();

                    document.getElementById("title").textContent =
                        data.title || "Untitled Listing";

                    document.getElementById("price").textContent =
                        "$" + (data.price ?? 0);

                    document.getElementById("desc").textContent =
                        data.desc || "No description provided.";

                    document.getElementById("tags").textContent =
                        "Tags: " + (data.tags?.join(", ") || "None");

                    const image = document.getElementById("image");

                    if (data.imageUrl) {
                        image.src = data.imageUrl;
                        image.style.display = "block";
                    } else {
                        image.style.display = "none";
                    }

                    document.getElementById("location").textContent =
                        data.location || "Not provided";

                    document.getElementById("contact").textContent =
                        data.contact || "Not provided";

                    document.getElementById("payment").textContent =
                        data.payment || "Not provided";
                } else {
                    document.getElementById("title").textContent =
                        "Listing not found.";
                }
            } catch (error) {
                console.error("Error loading product:", error);
                document.getElementById("title").textContent =
                    "Error loading listing.";
                document.getElementById("desc").textContent =
                    error.message;
            }
        }
    </script>

    <script type="module" src="site.js"></script>
</body>
</html>
