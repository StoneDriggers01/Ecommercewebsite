<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plywood Profile</title><link rel="stylesheet" href="style.css"></head><body><div class="background-overlay"></div><section class="hero small-hero"><div class="marketplace-title-box"><h1>Your Plywood Profile</h1></div></section><main class="profile-layout"><section class="profile-card"><h1>Profile</h1><h3>Email</h3><p id="profile-email">Loading...</p><h3>Display Name</h3><input id="profile-name" placeholder="Your display name"><h3>About You</h3><textarea id="profile-description" placeholder="Tell other scavengers about yourself."></textarea><button class="save-btn" id="save-profile">Save Profile</button><p id="profile-message" class="profile-message"></p></section><section class="user-listings"><h1>Your Listings</h1><div id="profile-listings">Loading...</div></section></main><script type="module">import {auth,db,doc,getDoc,getDocs,setDoc,collection,query,where,orderBy,updateProfile,onAuthStateChanged,deleteDoc} from "./firebase.js";const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");let user=null;async function load(u){user=u;document.getElementById("profile-email").textContent=u.email||"";document.getElementById("profile-name").value=u.displayName||"";const s=await getDoc(doc(db,"users",u.uid));if(s.exists())document.getElementById("profile-description").value=s.data().description||"";const el=document.getElementById("profile-listings"),snap=await getDocs(query(collection(db,"listings"),where("owner","==",u.uid),orderBy("createdAt","desc")));el.innerHTML="";if(snap.empty){el.innerHTML="<p>You have not posted any listings yet.</p>";return}snap.forEach(d=>{const x=d.data(),c=document.createElement("div");c.className="user-listing-card";c.innerHTML=`<h3>${esc(x.title||"Untitled Listing")}</h3><p>$${Number(x.price||0).toFixed(2)}</p><p>${esc(x.desc||"")}</p><button class="delete-btn">Delete Listing</button>`;c.querySelector("button").onclick=async()=>{if(confirm("Delete this listing?")){await deleteDoc(doc(db,"listings",d.id));c.remove()}};el.appendChild(c)})}document.getElementById("save-profile").onclick=async()=>{try{await updateProfile(user,{displayName:document.getElementById("profile-name").value.trim()});await setDoc(doc(db,"users",user.uid),{email:user.email,description:document.getElementById("profile-description").value.trim()},{merge:true});document.getElementById("profile-message").textContent="Profile saved."}catch(e){document.getElementById("profile-message").textContent=e.message}};onAuthStateChanged(auth,u=>{if(!u){location.replace("login.html?returnTo=profile.html");return}load(u).catch(e=>console.error(e))});</script><script type="module" src="site.js"></script></body></html>
