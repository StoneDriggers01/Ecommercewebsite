<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plywood Login</title><link rel="stylesheet" href="style.css"></head><body><div class="background-overlay"></div><section class="login-container"><div class="login-box"><h1>Welcome Back</h1><p>Log in to continue your treasure hunt.</p><input type="email" id="email" placeholder="Email"><input type="password" id="password" placeholder="Password"><button id="btn-login">Log In</button><button id="btn-signup" class="signup-btn">Create Account</button><p id="error-message" class="error-message"></p></div></section><script type="module">import {auth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged} from "./firebase.js";const email=document.getElementById("email"),password=document.getElementById("password"),err=document.getElementById("error-message");function dest(){const raw=new URLSearchParams(location.search).get("returnTo");if(!raw)return"products.html";try{const u=new URL(raw,location.href);return u.origin===location.origin?u.pathname.split("/").pop()+u.search:"products.html"}catch{return"products.html"}}function show(e){console.error(e);err.textContent=e?.message||"Authentication failed."}onAuthStateChanged(auth,u=>{if(u&&new URLSearchParams(location.search).has("returnTo"))location.replace(dest())});document.getElementById("btn-login").onclick=async()=>{err.textContent="";try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.replace(dest())}catch(e){show(e)}};document.getElementById("btn-signup").onclick=async()=>{err.textContent="";try{await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);location.replace(dest())}catch(e){show(e)}};</script></body></html>
