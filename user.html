<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Plywood</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-overlay"></div>

    <div class="profile-layout">
        <section class="user-listings">
            <p class="eyebrow">YOUR MARKETPLACE ACTIVITY</p>
            <h1>Your Listings</h1>

            <div id="user-listings-container">
                <p>Loading your listings...</p>
            </div>
        </section>

        <section class="profile-card">
            <p class="eyebrow">ACCOUNT</p>
            <h1>Your Profile</h1>

            <div class="profile-info">
                <h3>Username:</h3>
                <p id="display-name-text"></p>

                <h3>Email:</h3>
                <p id="email-text"></p>

                <h3>Phone Number:</h3>
                <p id="phone-text"></p>

                <h3>Description:</h3>
                <p id="desc-text"></p>
            </div>

            <h2>Edit Profile</h2>

            <label for="display-name">Display Name</label>
            <input type="text" id="display-name">

            <label for="phone">Phone Number</label>
            <input type="text" id="phone">

            <label for="description">Description</label>
            <textarea id="description"></textarea>

            <button id="save-profile" class="save-btn">Save Changes</button>
        </section>
    </div>

    <script type="module">
        import {
            auth,
            updateProfile,
            db,
            collection,
            query,
            where,
            getDocs,
            deleteDoc,
            doc,
            onAuthStateChanged
        } from "./firebase.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href =
                    `login.html?returnTo=${encodeURIComponent("user.html")}`;
                return;
            }

            document.getElementById("display-name-text").textContent =
                user.displayName || "Not set";

            document.getElementById("email-text").textContent =
                user.email || "Not set";

            document.getElementById("phone-text").textContent =
                user.phoneNumber || "Not set";

            document.getElementById("desc-text").textContent =
                user.photoURL || "No description";

            document.getElementById("display-name").value =
                user.displayName || "";

            document.getElementById("phone").value =
                user.phoneNumber || "";

            document.getElementById("description").value =
                user.photoURL || "";

            try {
                const q = query(
                    collection(db, "listings"),
                    where("owner", "==", user.uid)
                );

                const snapshot = await getDocs(q);
                const container =
                    document.getElementById("user-listings-container");

                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = `
                        <p>You have not posted any listings yet.</p>
                    `;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const card = document.createElement("div");
                    card.className = "user-listing-card";

                    card.innerHTML = `
                        ${
                            data.imageUrl
                                ? `<img src="${data.imageUrl}" class="listing-image" alt="${data.title || "Listing image"}">`
                                : ""
                        }

                        <h3>${data.title || "Untitled Listing"}</h3>

                        <p>
                            <strong>Price:</strong>
                            $${data.price ?? 0}
                        </p>

                        <p>${data.desc || "No description provided."}</p>

                        <button class="delete-btn" data-id="${docSnap.id}">
                            Delete Listing
                        </button>
                    `;

                    container.appendChild(card);
                });

                document.querySelectorAll(".delete-btn").forEach((btn) => {
                    btn.addEventListener("click", async (event) => {
                        event.stopPropagation();

                        const id = btn.getAttribute("data-id");

                        if (!confirm("Are you sure you want to delete this listing?")) {
                            return;
                        }

                        try {
                            await deleteDoc(doc(db, "listings", id));
                            btn.parentElement.remove();
                        } catch (error) {
                            console.error("Error deleting listing:", error);
                            alert("Error deleting listing: " + error.message);
                        }
                    });
                });

            } catch (error) {
                console.error("Error loading user listings:", error);

                document.getElementById(
                    "user-listings-container"
                ).innerHTML = `
                    <p class="error-message">
                        Error loading your listings.<br><br>
                        ${error.message}
                    </p>
                `;
            }
        });

        document.getElementById("save-profile").addEventListener(
            "click",
            async () => {
                const user = auth.currentUser;

                if (!user) {
                    alert("You must be logged in.");
                    return;
                }

                const displayName =
                    document.getElementById("display-name").value.trim();

                const description =
                    document.getElementById("description").value.trim();

                try {
                    await updateProfile(user, {
                        displayName,
                        photoURL: description
                    });

                    alert("Profile updated successfully!");
                    window.location.reload();

                } catch (error) {
                    console.error("Profile update error:", error);
                    alert("Error updating profile: " + error.message);
                }
            }
        );
    </script>

    <script type="module" src="site.js"></script>
</body>
</html>
