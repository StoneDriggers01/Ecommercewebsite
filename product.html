<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plywood – Product</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">Plywood</div>
        <nav class="nav-buttons">
            <a href="products.html"><button>Back</button></a>
        </nav>
    </header>

    <section class="product-view">
        <img id="product-img" src="" alt="Product Image">

        <h2 id="product-name"></h2>
        <p class="price">$1</p>

        <p id="product-description"></p>

        <p><strong>Contact:</strong> (555)-555-5555</p>
        <p><strong>Location:</strong> Old Town Thrift — 112 Market Street, Due West, SC</p>

        <div class="payment-options">
            <button>PayPal</button>
            <button>Credit / Debit</button>
            <button>CashApp</button>
        </div>
    </section>

    <script>
        const params = new URLSearchParams(window.location.search);
        const item = params.get("item");

        const products = {
            phones: {
                img: "images/phones.png",
                name: "Vintage Phones",
                desc: "A curated selection of classic rotary and push-button telephones. Each piece is fully cleaned, tested, and ready for display or functional retro use."
            },
            tv: {
                img: "images/tv.png",
                name: "Retro CRT TV",
                desc: "A 1970s-style CRT television featuring authentic knobs, woodgrain trim, and warm analog glow. Ideal for retro gaming or vintage decor."
            },
            typewriter: {
                img: "images/typewriter.png",
                name: "Classic Typewriter",
                desc: "A fully functional mechanical typewriter with crisp keystrokes and a timeless metal frame. Perfect for collectors or analog writing enthusiasts."
            },
            clothes: {
                img: "images/clothes.png",
                name: "Men's Clothing Rack",
                desc: "A curated rack of men's vintage shirts, jackets, and casual wear sourced from local thrift partners. Styles range from classic denim to retro prints."
            },
            clothes2: {
                img: "images/clothes2.png",
                name: "Women's Clothing Rack",
                desc: "A selection of women's thrift apparel including tops, dresses, and seasonal outfits. Affordable, stylish, and sustainably sourced."
            },
            antiquestore: {
                img: "images/antiquestore.png",
                name: "Shipley Antiques Interior",
                desc: "A curated assortment of antique furniture, decor, and collectibles from Shipley Antiques. Each item carries unique history and craftsmanship."
            }
        };

        const product = products[item];

        if (product) {
            document.getElementById("product-img").src = product.img;
            document.getElementById("product-name").innerText = product.name;
            document.getElementById("product-description").innerText = product.desc;
        } else {
            document.getElementById("product-name").innerText = "Product Not Found";
            document.getElementById("product-description").innerText = "The item you're looking for doesn't exist or is no longer available.";
        }
    </script>
</body>
</html>
